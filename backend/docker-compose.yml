services:
  db:
    image: pgvector/pgvector:pg16
    container_name: hyperwrite-db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - hyperconnection
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hyperwrite-api
    restart: always
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app:z
    networks:
      - hyperconnection

  inference-embeddings:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: inference-embeddings
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./llms/models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      -m /models/nomic-embed-text-v1.5.Q8_0.gguf
      -c 2048
      --ubatch-size 2048
      --host 0.0.0.0
      --port 8080
      -ngl 99
      --embeddings
      --pooling mean
    networks:
      - hyperconnection

  inference-chat:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: inference-chat
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - ./llms/models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      -m /models/gemma-4-E2B-RotorQuant-Q8_0.gguf
      -c 16384
      --host 0.0.0.0
      --port 8080
      -ngl 99
      --jinja
    networks:
      - hyperconnection

networks:
  hyperconnection:
    driver: bridge

volumes:
  pgdata:
